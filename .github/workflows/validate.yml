name: Validierung

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: |
          pip install pytest-homeassistant-custom-component
          FE=$(python -c "import json,homeassistant.components.frontend as f,pathlib;print([r for r in json.loads((pathlib.Path(f.__file__).parent/'manifest.json').read_text())['requirements'] if r.startswith('home-assistant-frontend')][0])")
          pip install "$FE"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci && npm run build
      - name: Gebautes Panel muss eingecheckt sein
        run: git diff --exit-code custom_components/energiekostenaufstellung/www/
